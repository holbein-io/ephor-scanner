name: PR Title

# PRs are squash-merged with the PR title as the commit message, and release-please builds
# versions and the changelog from those messages. So the title must be a Conventional Commit.
on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  conventional-title:
    name: Conventional PR title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            revert
            docs
            refactor
            test
            ci
            build
            chore
          # Release PRs opened by release-please use "chore(main): release X.Y.Z"
          requireScope: false
