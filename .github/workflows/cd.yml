name: CD

# Pre-release images only. Releases (vX.Y.Z, X.Y, latest) are built by release.yml.
#   PR    -> pr-<n>, sha-<sha>     (deleted by cleanup-packages.yml when the PR closes)
#   main  -> edge, main, sha-<sha>
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  image:
    uses: ./.github/workflows/build-image.yml
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      environment: ${{ github.event_name == 'pull_request' && 'staging' || '' }}
      version: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || format('edge-{0}', github.sha) }}
      sign: ${{ github.event_name != 'pull_request' }}
      tags: |
        type=sha
        type=ref,event=branch
        type=ref,event=pr
        type=raw,value=edge,enable={{is_default_branch}}
